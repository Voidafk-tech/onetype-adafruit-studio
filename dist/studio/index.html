<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OneType Studio</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="studio.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><img src="assets/logo-on-dark.png" alt="OneType" width="150" height="43"><span>Studio · Adafruit workspace</span></div>
      <nav id="nav" aria-label="Sections"></nav>
      <p class="side-note">Local C++ engine · runs are isolated and replayable</p>
    </aside>
    <div class="main">
      <header class="topbar"><button id="play-demo" class="play">▶ Play demo</button><span id="run-status"><span class="dot"></span>Connecting…</span></header>
      <main id="view" tabindex="-1"><p class="empty">Loading engine configuration…</p></main>
    </div>
  </div>
  <div id="drawer" class="drawer-host"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
